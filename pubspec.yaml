name: kicker_app
description: Kicker-Auslosung, Ergebnisse und Tabellen – Flutter-Port (iOS-Look via Cupertino, Android-Look via Material)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.3.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  http: ^1.2.2
  uuid: ^4.4.2
  intl: ^0.20.3
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
